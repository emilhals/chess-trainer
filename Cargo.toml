[package]
name = "chess-trainer"
version = "0.2.0"
edition = "2024"
description = "Practice chess openings in the terminal."
repository = "https://github.com/emilhals/chess-trainer"
readme = "README.md"
license = "MIT"

[dependencies]
better-panic = "0.3.0"
color-eyre = "0.6.5"
derive_setters = "0.1.9"
directories = "6.0.0"
human-panic = "2.0.8"
libc = "0.2.189"
log = "0.4.34"
rand = "0.10.2"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info", "serde"]}
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
shakmaty = "0.30.1"
strip-ansi-escapes = "0.2.1"

[profile.release]
codegen-units = 1
lto = true 
opt-level = "s"
strip = true 
